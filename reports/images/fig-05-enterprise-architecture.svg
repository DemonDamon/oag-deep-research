<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" role="img">
  <defs>
    <marker id="arr5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="s5" x="-5%" y="-8%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1120" height="720" fill="#F6F7FB"/>
  <text x="40" y="38" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0F172A">企业本体与工具层：六层最小可用架构</text>
  <text x="40" y="64" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">可独立验证、可逐步替换；不要一次性自研「大而全平台」。Agent 只经授权工具进入应用层，只经审批进入行动层。</text>

  <g font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">
    <g filter="url(#s5)"><rect x="40" y="88" width="210" height="88" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <text x="145" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">业务目标</text>
    <text x="145" y="144" text-anchor="middle" font-size="12" fill="#64748B">一个可量化决策闭环</text>
    <text x="145" y="164" text-anchor="middle" font-size="11" fill="#94A3B8">先结果，后数据</text>

    <g filter="url(#s5)"><rect x="310" y="88" width="500" height="88" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/></g>
    <text x="560" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">业务对象图</text>
    <text x="560" y="144" text-anchor="middle" font-size="12" fill="#4F46E5">10-30 个核心对象 / 关系 / 状态 / 责任 / 证据</text>
    <text x="560" y="164" text-anchor="middle" font-size="11" fill="#6366F1">失败模式：从全公司数据建模开始</text>

    <g filter="url(#s5)"><rect x="870" y="88" width="210" height="88" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <text x="975" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">来源系统</text>
    <text x="975" y="144" text-anchor="middle" font-size="12" fill="#64748B">ERP / CRM / MES</text>
    <text x="975" y="164" text-anchor="middle" font-size="11" fill="#94A3B8">IoT / 文档 / 既有应用</text>

    <g filter="url(#s5)"><rect x="310" y="220" width="500" height="78" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <text x="560" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">数据接入与质量层</text>
    <text x="560" y="274" text-anchor="middle" font-size="12" fill="#64748B">连接 / 契约 / 谱系 / 版本 / 权威来源 / 冲突处理</text>

    <g filter="url(#s5)"><rect x="310" y="342" width="500" height="78" rx="14" fill="#FFFFFF" stroke="#DDD6FE"/></g>
    <text x="560" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#6D28D9">逻辑层</text>
    <text x="560" y="396" text-anchor="middle" font-size="12" fill="#7C3AED">指标 / 规则 / 模型 / 函数 / 情景 / 评价样本</text>

    <g filter="url(#s5)"><rect x="310" y="464" width="240" height="88" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/></g>
    <text x="430" y="496" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">工具与应用层</text>
    <text x="430" y="518" text-anchor="middle" font-size="12" fill="#0F766E">对象视图 / 任务队列</text>
    <text x="430" y="536" text-anchor="middle" font-size="11" fill="#14B8A6">运营应用 / SDK / API</text>

    <g filter="url(#s5)"><rect x="570" y="464" width="240" height="88" rx="14" fill="#FFFBEB" stroke="#FDE68A"/></g>
    <text x="690" y="496" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">受控行动层</text>
    <text x="690" y="518" text-anchor="middle" font-size="12" fill="#B45309">命令 / 校验 / 审批</text>
    <text x="690" y="536" text-anchor="middle" font-size="11" fill="#D97706">幂等 / 外部写回</text>

    <g filter="url(#s5)"><rect x="310" y="596" width="500" height="70" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/></g>
    <text x="560" y="626" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">结果、事件与反馈</text>
    <text x="560" y="648" text-anchor="middle" font-size="12" fill="#64748B">回流到对象历史，成为下一轮规则改进与模型评测素材</text>

    <g filter="url(#s5)"><rect x="40" y="220" width="210" height="332" rx="14" fill="#FEF2F2" stroke="#FECACA"/></g>
    <text x="145" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#9F1239">横向治理</text>
    <text x="145" y="286" text-anchor="middle" font-size="12" fill="#BE123C">身份 / 授权</text>
    <text x="145" y="308" text-anchor="middle" font-size="12" fill="#BE123C">用途控制</text>
    <text x="145" y="330" text-anchor="middle" font-size="12" fill="#BE123C">审计 / 评估</text>
    <text x="145" y="352" text-anchor="middle" font-size="12" fill="#BE123C">发布 / 回滚</text>
    <text x="145" y="390" text-anchor="middle" font-size="11" fill="#9F1239">约束对象、逻辑、</text>
    <text x="145" y="408" text-anchor="middle" font-size="11" fill="#9F1239">应用与 Action</text>
    <text x="145" y="444" text-anchor="middle" font-size="11" fill="#94A3B8">权限不是上线后</text>
    <text x="145" y="462" text-anchor="middle" font-size="11" fill="#94A3B8">再补的附属工作</text>

    <g filter="url(#s5)"><rect x="870" y="342" width="210" height="210" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/></g>
    <text x="975" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">Agent / 自动化</text>
    <text x="975" y="410" text-anchor="middle" font-size="12" fill="#7C3AED">只经授权工具</text>
    <text x="975" y="432" text-anchor="middle" font-size="12" fill="#7C3AED">进入应用层</text>
    <text x="975" y="466" text-anchor="middle" font-size="12" fill="#7C3AED">只生成提案或</text>
    <text x="975" y="488" text-anchor="middle" font-size="12" fill="#7C3AED">受审批命令</text>
    <text x="975" y="522" text-anchor="middle" font-size="11" fill="#94A3B8">禁止直连业务库写权限</text>
  </g>

  <path d="M250,132 H302" stroke="#64748B" stroke-width="2" marker-end="url(#arr5)"/>
  <path d="M870,132 H818" stroke="#64748B" stroke-width="2" marker-end="url(#arr5)"/>
  <path d="M560,176 V212" stroke="#64748B" stroke-width="2" marker-end="url(#arr5)"/>
  <path d="M560,298 V334" stroke="#64748B" stroke-width="2" marker-end="url(#arr5)"/>
  <path d="M560,420 V456" stroke="#64748B" stroke-width="2" marker-end="url(#arr5)"/>
  <path d="M430,552 V588" stroke="#64748B" stroke-width="2" marker-end="url(#arr5)"/>
  <path d="M690,552 V588" stroke="#64748B" stroke-width="2" marker-end="url(#arr5)"/>
  <path d="M250,386 H302" stroke="#BE123C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr5)"/>
  <path d="M870,447 H818" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr5)"/>
</svg>
