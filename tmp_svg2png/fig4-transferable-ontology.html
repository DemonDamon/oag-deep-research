<!DOCTYPE html><html><head><meta charset="utf-8"/><style>body{margin:0;padding:0;display:inline-block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">

  <text x="380" y="338" text-anchor="middle" font-size="11" fill="#94a3b8">ontology-as-code · Git 版本化</text>

  <line x1="550" y1="125" x2="532" y2="240" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a4)"/>
