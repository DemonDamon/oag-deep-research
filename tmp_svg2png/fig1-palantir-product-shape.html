<!DOCTYPE html><html><head><meta charset="utf-8"/><style>body{margin:0;padding:0;display:inline-block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="620" rx="14" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Palantir Foundry Ontology 产品形态（分层视图）</text>
  <text x="380" y="58" text-anchor="middle" font-size="12" fill="#64748b">「数据 → 语义对象 → 逻辑 → 受控行动 → 安全治理」的闭环操作层</text>

  <rect x="60" y="80" width="640" height="64" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="80" y="104" font-size="14" font-weight="700" fill="#4338ca">① 应用与交互层</text>
  <text x="80" y="126" font-size="12" fill="#4f46e5">AIP 应用 · Workshop 工作台 · 应用市场（业务任务界面，而非纯检索问答）</text>

  <rect x="60" y="164" width="640" height="80" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="80" y="188" font-size="14" font-weight="700" fill="#b91c1c">② 操作型本体层（核心 Ontology）</text>
  <text x="80" y="210" font-size="12" fill="#7f1d1d">对象 Object（稳定 ID / 类型）· 属性 Property · 链接 Link（关系），可构成「数字孪生」</text>
  <text x="80" y="228" font-size="12" fill="#7f1d1d">定位：数据集、虚拟表与模型之上的可操作业务世界，而非单纯知识图谱</text>

  <rect x="60" y="264" width="640" height="64" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="80" y="288" font-size="14" font-weight="700" fill="#c2410c">③ 逻辑与动作层</text>
  <text x="80" y="310" font-size="12" fill="#9a3412">Action（带用户定义逻辑的事务写回）· Function（任意复杂度业务逻辑）</text>

  <rect x="60" y="348" width="640" height="64" rx="10" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="80" y="372" font-size="14" font-weight="700" fill="#166534">④ SDK / Agent 接入层</text>
  <text x="80" y="394" font-size="12" fill="#14532d">OSDK（TypeScript / Python / Java / OpenAPI）· Palantir MCP · AIP 工具</text>

  <rect x="60" y="432" width="640" height="64" rx="10" fill="#fefce8" stroke="#facc15"/>
  <text x="80" y="456" font-size="14" font-weight="700" fill="#854d0e">⑤ 安全与治理层（横贯）</text>
  <text x="80" y="478" font-size="12" fill="#713f12">动态安全（对象级权限）· 范围 Token · 本体修改提案审批（proposal review）</text>

  <rect x="60" y="516" width="640" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="80" y="540" font-size="14" font-weight="700" fill="#334155">⑥ 数据底座</text>
  <text x="80" y="562" font-size="12" fill="#475569">数据集 Dataset · 虚拟表 · 模型（model）——语义对象之下的事实来源</text>

  <line x1="722" y1="552" x2="722" y2="112" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="740" y="330" font-size="11" fill="#3b82f6" transform="rotate(90 740 330)">数据向上汇聚为对象</text>
</svg>
</body></html>
