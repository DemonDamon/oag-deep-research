<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="760" height="640" rx="14" fill="#f8fafc"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">企业本体论产品构建：六层参考架构与难点 → 方案</text>

  <rect x="30" y="60" width="250" height="32" rx="6" fill="#1e293b"/>
  <text x="155" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">架构层</text>
  <rect x="292" y="60" width="210" height="32" rx="6" fill="#1e293b"/>
  <text x="397" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">技术难点</text>
  <rect x="514" y="60" width="216" height="32" rx="6" fill="#1e293b"/>
  <text x="622" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">对应技术方案</text>

  <g font-size="11.5">
    <rect x="30" y="100" width="250" height="82" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="42" y="124" font-weight="700" fill="#4338ca">L1 数据接入层</text>
    <text x="42" y="144" fill="#4f46e5">数据集 / 虚拟表 / 模型</text>
    <text x="42" y="162" fill="#4f46e5">多源异构、数据质量</text>
    <rect x="292" y="100" width="210" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="304" y="126" fill="#334155">源系统语义不一致、</text>
    <text x="304" y="144" fill="#334155">口径漂移、脏数据</text>
    <text x="304" y="162" fill="#334155">污染本体</text>
    <rect x="514" y="100" width="216" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="526" y="124" fill="#166534">湖仓 + 数据血缘</text>
    <text x="526" y="142" fill="#166534">版本化数据集</text>
    <text x="526" y="160" fill="#166534">schema 契约</text>

    <rect x="30" y="190" width="250" height="82" rx="6" fill="#fef2f2" stroke="#f87171"/>
    <text x="42" y="214" font-weight="700" fill="#b91c1c">L2 语义建模层</text>
    <text x="42" y="234" fill="#7f1d1d">对象 / 属性 / 链接</text>
    <text x="42" y="252" fill="#7f1d1d">术语对齐、本体建模</text>
    <rect x="292" y="190" width="210" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="304" y="216" fill="#334155">领域术语不统一、</text>
    <text x="304" y="234" fill="#334155">关系建模复杂、</text>
    <text x="304" y="252" fill="#334155">变更演进难</text>
    <rect x="514" y="190" width="216" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="526" y="214" fill="#166534">RDF/OWL + SHACL</text>
    <text x="526" y="232" fill="#166534">领域专家协同建模</text>
    <text x="526" y="250" fill="#166534">本体版本控制</text>

    <rect x="30" y="280" width="250" height="82" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="42" y="304" font-weight="700" fill="#c2410c">L3 存储与查询层</text>
    <text x="42" y="324" fill="#9a3412">图存储 + 索引</text>
    <text x="42" y="342" fill="#9a3412">规模、图遍历、推理</text>
    <rect x="292" y="280" width="210" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="304" y="306" fill="#334155">大规模图遍历慢、</text>
    <text x="304" y="324" fill="#334155">复杂推理代价高、</text>
    <text x="304" y="342" fill="#334155">召回精度不足</text>
    <rect x="514" y="280" width="216" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="526" y="304" fill="#166534">图数据库 + 向量索引</text>
    <text x="526" y="322" fill="#166534">混合检索（图+向量）</text>
    <text x="526" y="340" fill="#166534">增量推理物化</text>

    <rect x="30" y="370" width="250" height="82" rx="6" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="42" y="394" font-weight="700" fill="#166534">L4 逻辑与动作层</text>
    <text x="42" y="414" fill="#14532d">Action / Function</text>
    <text x="42" y="432" fill="#14532d">业务规则、事务写回</text>
    <rect x="292" y="370" width="210" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="304" y="396" fill="#334155">写回事务一致性、</text>
    <text x="304" y="414" fill="#334155">规则编排、</text>
    <text x="304" y="432" fill="#334155">幂等与回滚</text>
    <rect x="514" y="370" width="216" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="526" y="394" fill="#166534">Action 提案 + 审批</text>
    <text x="526" y="412" fill="#166534">规则引擎 + 幂等</text>
    <text x="526" y="430" fill="#166534">函数服务编排</text>

    <rect x="30" y="460" width="250" height="82" rx="6" fill="#fefce8" stroke="#facc15"/>
    <text x="42" y="484" font-weight="700" fill="#854d0e">L5 安全治理层</text>
    <text x="42" y="504" fill="#713f12">权限 / 审计 / 合规</text>
    <text x="42" y="522" fill="#713f12">（横贯所有层）</text>
    <rect x="292" y="460" width="210" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="304" y="486" fill="#334155">对象级权限、</text>
    <text x="304" y="504" fill="#334155">审计追溯、</text>
    <text x="304" y="522" fill="#334155">合规红线</text>
    <rect x="514" y="460" width="216" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="526" y="484" fill="#166534">最小权限 + 范围Token</text>
    <text x="526" y="502" fill="#166534">审批流 + 审计日志</text>
    <text x="526" y="520" fill="#166534">数据血缘合规</text>

    <rect x="30" y="550" width="250" height="76" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="42" y="574" font-weight="700" fill="#334155">L6 Agent 接入层</text>
    <text x="42" y="594" fill="#475569">OSDK / MCP / AIP</text>
    <text x="42" y="612" fill="#475569">Agent 编排</text>
    <rect x="292" y="550" width="210" height="76" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="304" y="574" fill="#334155">Agent 越权、幻觉、</text>
    <text x="304" y="592" fill="#334155">不可追溯、</text>
    <text x="304" y="610" fill="#334155">工具滥用</text>
    <rect x="514" y="550" width="216" height="76" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="526" y="574" fill="#166534">只读默认 + 工具白名单</text>
    <text x="526" y="592" fill="#166534">证据链 + 上下文治理</text>
    <text x="526" y="610" fill="#166534">可观测运行时</text>
  </g>
</svg>
